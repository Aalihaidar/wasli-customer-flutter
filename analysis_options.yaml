# Static analysis for the customer app. `flutter analyze --fatal-infos` is the gate (CI and pre-push).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # Generated by scripts/generate-api.sh from the pinned contract; never edited by hand.
    - lib/api/**
    # Generated from l10n/*.arb by `flutter gen-l10n`; not committed.
    - lib/core/l10n/generated/**
    - '**/*.g.dart'

formatter:
  page_width: 120

linter:
  rules:
    # The formatter keeps lines within 120 columns (see formatter above).
    lines_longer_than_80_chars: false
