<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced at build time by the value of `flutter build web --base-href`. It must start and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Order from your car at the restaurant.">
  <meta name="theme-color" content="#1F2A44">

  <!-- iOS meta tags and icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wasli">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Wasli</title>
  <link rel="manifest" href="manifest.json">

  <!-- Plain HTML splash, shown until the app draws its first frame (removed in flutter_bootstrap.js). -->
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <span class="splash-wordmark">Wasli</span>
    <span class="splash-bar"></span>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
