name: wasli_customer
description: "Wasli customer app: order from the car at the restaurant."
# A private app, never published to pub.dev.
publish_to: 'none'

# <version>+<build number>. The build number becomes the Android versionCode and the iOS CFBundleVersion.
version: 0.1.0+1

environment:
  flutter: 3.50.0
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  # Path URL strategy on the web (usePathUrlStrategy); part of the Flutter SDK.
  flutter_web_plugins:
    sdk: flutter
  json_annotation: ^4.12.0
  material_ui: ^1.11.1
  retrofit: ^4.10.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.3
  swagger_parser: ^2.3.0
  very_good_analysis: ^11.0.0

flutter:
  # The flavor a plain `flutter run` uses. The environments are `staging` and `production`.
  default-flavor: staging

  uses-material-design: true
